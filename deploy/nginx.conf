events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map "$request_method:$http_origin" $origin_to_check {
    default "$scheme://$http_host";
    ~^(POST|PUT|PATCH|DELETE):.+$ $http_origin;
  }
  map "$request_method:$http_sec_fetch_site" $reject_csrf {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):cross-site$ 1;
  }
  server {
    listen 80;
    server_name _;
    include /etc/nginx/portal-routes.conf;
  }
}

