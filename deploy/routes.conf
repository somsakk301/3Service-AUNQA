client_max_body_size 100m;
proxy_read_timeout 600s;
proxy_connect_timeout 10s;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy same-origin always;
if ($reject_csrf) { return 403; }
if ($origin_to_check != "$scheme://$http_host") { return 403; }
set $monitor http://monitor-backend:8000;
set $import http://import-backend:8000;
set $generator http://generator-backend:8010;
set $portal http://portal-frontend:8080;

location = /healthz { access_log off; return 200 'ok'; }
location = /_session {
  internal;
  proxy_pass $monitor/api/auth/me;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie $http_cookie;
}
location /api/auth/ { proxy_pass $monitor$request_uri; }
location = /api/monitor { auth_request /_session; proxy_pass $monitor$request_uri; }
location /api/monitor/ { auth_request /_session; proxy_pass $monitor$request_uri; }
location /api/import/ {
  auth_request /_session;
  rewrite ^/api/import/(.*)$ /api/$1 break;
  proxy_pass $import$uri$is_args$args;
}
location /api/generator/ {
  auth_request /_session;
  rewrite ^/api/generator/(.*)$ /api/$1 break;
  proxy_pass $generator$uri$is_args$args;
}
location /api/ { return 404; }
location /import-workspace/ {
  auth_request /_session;
  rewrite ^/import-workspace/(.*)$ /$1 break;
  proxy_pass $import$uri$is_args$args;
  proxy_set_header Accept-Encoding "";
  sub_filter_once off;
  sub_filter 'href="/static/' 'href="/import-workspace/static/';
  sub_filter 'src="/static/app.js"' 'src="/import-workspace/static/app.js"';
  sub_filter '<head>' '<head><script>window.IMPORT_API_PREFIX="/api/import";</script><style>.site-header{display:none!important}</style>';
}
location / { proxy_pass $portal$request_uri; }

