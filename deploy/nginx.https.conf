events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map "$request_method:$http_origin" $origin_to_check {
    default "$scheme://$http_host";
    ~^(POST|PUT|PATCH|DELETE):.+$ $http_origin;
  }
  map "$request_method:$http_sec_fetch_site" $reject_csrf {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):cross-site$ 1;
  }
  server {
    listen 80;
    location = /healthz { return 200 'ok'; }
    location / { return 308 https://$host$request_uri; }
  }
  server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/portal-routes.conf;
  }
}
